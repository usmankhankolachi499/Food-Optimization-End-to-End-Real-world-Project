{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="section-head">
      <div>
        <div class="eyebrow"><i class="bi bi-shield-lock"></i> Account security</div>
        <h1>Change password</h1>
        <p>Use a strong password with at least 8 characters.</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-body">
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <div class="password-wrap">
              <input class="form-control" id="current_password" name="current_password" type="password" required>
              <button class="password-toggle" type="button" data-password-toggle="current_password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New password</label>
            <div class="password-wrap">
              <input class="form-control" id="new_password" name="new_password" type="password" required>
              <button class="password-toggle" type="button" data-password-toggle="new_password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <div class="password-wrap">
              <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
              <button class="password-toggle" type="button" data-password-toggle="confirm_password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-brand" type="submit"><i class="bi bi-check2 me-1"></i> Update password</button>
            <a class="btn btn-ghost" href="{{ url_for(current_user.dashboard_endpoint) }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    <p class="small-note mt-3"><i class="bi bi-info-circle me-1"></i> You will stay signed in on this device after changing your password.</p>
  </div>
</div>
{% endblock %}
