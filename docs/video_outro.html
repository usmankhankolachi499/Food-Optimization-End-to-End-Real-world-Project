<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>outro</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 30% 20%, #24395c 0%, #16263f 55%, #0e1930 100%);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card { text-align: center; padding: 60px; max-width: 1100px; }
  .moon { font-size: 90px; }
  h1 { font-size: 84px; margin: 10px 0; color: #e8c87a; letter-spacing: .5px; }
  h1 span { color: #fff; }
  p.sub { font-size: 30px; color: #cdd6ea; margin: 8px 0 34px; font-family: 'Segoe UI', Arial, sans-serif; }
  .badges { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .badge {
    font-family: 'Segoe UI', Arial, sans-serif;
    border: 1px solid rgba(232,200,122,.55); color: #e8c87a;
    padding: 12px 26px; border-radius: 999px; font-size: 22px;
    background: rgba(232,200,122,.08);
  }
  .cta { margin-top: 44px; font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; color: #fff; }
  .cta b { color: #e8c87a; }
</style>
</head>
<body>
  <div class="card">
    <div class="moon">🌙</div>
    <h1><span>MOON</span> Light</h1>
    <p class="sub">Food Delivery Optimization System — built end to end</p>
    <div class="badges">
      <span class="badge">Flask</span>
      <span class="badge">SQL Server (T-SQL)</span>
      <span class="badge">MongoDB</span>
      <span class="badge">Machine Learning</span>
      <span class="badge">Live GPS Maps</span>
    </div>
    <div class="cta">Hungry for a project like this? <b>DM me.</b></div>
  </div>
</body>
</html>
